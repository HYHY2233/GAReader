<div class="paper-tags" aria-label="论文标签">{% for tag in selected_tags %}<span class="paper-tag{% if not tag.active %} inactive{% endif %}">{{ tag.name }}{% if not tag.active %}（已停用）{% endif %}</span>{% empty %}<span class="muted">尚未补充标签</span>{% endfor %}{% if user.is_staff or paper.submitter_id == user.id %}<a href="{% url 'paper-metadata' paper.id %}">{% if selected_tags %}修改标签{% else %}补充标签{% endif %}</a>{% endif %}</div>
