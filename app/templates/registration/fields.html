{% if form.non_field_errors %}<div class="error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="auth-field">
{{ field.label_tag }}{{ field }}
{% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
{% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
</div>{% endfor %}
